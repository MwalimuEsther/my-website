<head>

  <meta name="description" content="Subscribe and get in touch to watch short Swahili videos on literature and CBC basics for learners and educators.">

<body>
  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="videos.html">Videos</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <main>
    <h1>Contact Esther</h1>
    <p>Send a question or a video request.</p>

    <form id="contactForm" novalidate>
      <label for="name">Your name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Your email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Your message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <p id="formMessage" aria-live="polite"></p>

      <button type="submit">Send</button>
    </form>
  </main>
</body>
</html>
